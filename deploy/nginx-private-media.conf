# e-Shajara — oila rasmlarini to'g'ridan-to'g'ri ochishni yopish.
#
# Shaxslarning suratlari, profil rasmlari va taklif ko'rinishlari faqat Django
# orqali beriladi: u har safar so'ragan odam shajarani ko'ra olishini
# tekshiradi. /media/... havolasi tarqalsa ham, nginx uni bermaydi.
#
# Ulash (server { ... } bloki ichida, har ikkala — 80 va 443 — blokda):
#     include /srv/e-shajara/deploy/nginx-private-media.conf;
# So'ng:  sudo nginx -t && sudo systemctl reload nginx

location ^~ /media/photos/   { return 404; }
location ^~ /media/people/   { return 404; }
location ^~ /media/previews/ { return 404; }
