# e-Shajara — nginx sayt sozlamasi
#
# Joylash:  sudo cp deploy/nginx-e-shajara.conf /etc/nginx/sites-available/e-shajara
#           sudo ln -s /etc/nginx/sites-available/e-shajara /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
# So'ng:    sudo certbot --nginx -d e-shajara.uz -d www.e-shajara.uz
#           (certbot shu faylga 443-port va HTTPS yo'naltirishni o'zi qo'shadi)
#
# Serverdagi boshqa sayt o'z faylida qoladi — nginx so'ralgan domen
# (server_name) bo'yicha qaysi saytni ochishni ajratadi.

upstream e_shajara_app {
    server unix:/run/e-shajara/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name e-shajara.uz www.e-shajara.uz;

    # Tarixiy xarita rasmlari 20 MB gacha.
    client_max_body_size 25m;

    access_log /var/log/nginx/e-shajara.access.log;
    error_log  /var/log/nginx/e-shajara.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # collectstatic natijasi: fayl nomida xesh bor, shuning uchun uzoq keshlanadi.
    location /static/ {
        alias /srv/e-shajara/staticfiles/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Foydalanuvchi yuklagan rasmlar (nomlari tasodifiy).
    location /media/ {
        alias /srv/e-shajara/media/;
        access_log off;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location = /favicon.ico { access_log off; log_not_found off; return 204; }

    location / {
        proxy_pass http://e_shajara_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;   # katta PDF kitob yasash vaqti
    }
}
